description: MPU6050 device driver

compatible: "invensense,mpu6050"

# FILL IN when bringing up hardware, e.g.:
#   include: i2c-device.yaml
#   on-bus: i2c

properties:
  accel-fs:
    description: Accelerometer full-scale range in g
    type: int
    default: 2
    enum:
      - 2
      - 4
      - 8
      - 16

  gyro-fs:
    description: Gyroscope full-scale range in degrees per second
    type: int
    default: 250
    enum:
      - 250
      - 500
      - 1000
      - 2000

  smplrt-div:
    description: Sample rate divider
    type: int
    default: 0
